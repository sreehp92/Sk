        function openPromoPopup() {
            const overlay = document.getElementById('promo-popup');

            overlay.classList.add('popup-overlay-active');

        function closePromoPopup() {

        // Toast Notification System

        function showToast(message, type = 'success') {

            const container = document.getElementById('toast-container');

            const toast = document.createElement('div');

            let bg = 'bg-emerald-600', icon = 'fa-circle-check';

            if (type === 'error') { bg = 'bg-red-600'; icon = 'fa-circle-exclamation'; }

            else if (type === 'info') { bg = 'bg-amber-600'; icon = 'fa-circle-info'; }

            toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-3 pointer-events-auto transition transform translate-y-2 opacity-0 duration-300 max-w-sm`;

            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span class="text-sm font-medium">${message}</span>`;

            container.appendChild(toast);

            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);

            setTimeout(() => {

                toast.classList.add('translate-y-2', 'opacity-0');

                setTimeout(() => toast.remove(), 300);

                `Mobile: ${mobile}\n\n` +

        let detailQtyMap = {};

            let current = detailQtyMap[id] || 1;

            if (el) el.innerText = current;

        }

        function decrementDetailQty(id) {

            let current = detailQtyMap[id] || 1;

            if (current > 1) current--;

            detailQtyMap[id] = current;

            const el = document.getElementById(`detail-qty-${id}`);

            if (el) el.innerText = current;

        }



        function addToCart(productId, qty = 1) {

            const product = productsData.find(p => p.id === productId);

            if (!product) return;

            const existing = cart.find(item => item.id === productId);

            if (existing) { existing.qty += qty; } else { cart.push({ ...product, qty: qty }); }

            updateCartBadge();

            refreshCardAction(productId);

            // Silent add per instruction: no popup toast

        }



        function addToCartWithQty(productId) {

            const qty = detailQtyMap[productId] || 1;

            addToCart(productId, qty);

            openCartDrawer();

        }



        function updateCartBadge() {

            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);

            const badge = document.getElementById('cart-badge');

            const mobileBadge = document.getElementById('mobile-cart-badge');

            const headerCount = document.getElementById('cart-count-header');



            if (badge) {

                if (totalCount > 0) { badge.innerText = totalCount; badge.classList.remove('hidden'); }

                else { badge.classList.add('hidden'); }

            }

            if (mobileBadge) {

                if (totalCount > 0) { mobileBadge.innerText = totalCount; mobileBadge.classList.remove('hidden'); }

                else { mobileBadge.classList.add('hidden'); }

            }

            if (headerCount) headerCount.innerText = totalCount;

        }

            document.getElementById('cart-drawer').classList.add('hidden');

        function updateCartQty(productId, delta) {

            const item = cart.find(i => i.id === productId);

            if (item) {

                item.qty += delta;

                if (item.qty <= 0) { cart = cart.filter(i => i.id !== productId); }

            }

            updateCartBadge();

            renderCartDrawerContent();

            refreshCardAction(productId); // sync UI

        }



        function removeFromCart(productId) {

            cart = cart.filter(i => i.id !== productId);

        function sendWhatsAppTextEnquiry() {

            const totalMrp = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const totalDiscount = cart.reduce((sum, item) => sum + ((item.discount || 0) ? (item.price * item.discount / 100) * item.qty : 0), 0);

            const subtotal = Math.round(totalMrp - totalDiscount);



            let itemsText = cart.map(i => {

                const finalP = i.discount ? Math.round(i.price - (i.price * i.discount / 100)) : i.price;

                return `- ${i.name} (${i.unit}) x ${i.qty} = ₹${finalP * i.qty}`;

            }).join('\n');



            const message = encodeURIComponent(`*New Enquiry - ${siteSettings.brandName}*\n\nName: ${customerDetails.name}\nMobile: ${customerDetails.mobile}\n\n*Items:*\n${itemsText}\n\n*Total MRP:* ₹${Math.round(totalMrp)}\n*Total Savings:* ₹${Math.round(totalDiscount)}\n*Final Total:* ₹${subtotal}`);

            window.open(`https://wa.me/91${siteSettings.whatsappNumber}?text=${message}`, '_blank');

            cart = [];

            checkoutStep = 'form';

            updateCartBadge();

            closeCartDrawer();



            // Re-render current page to clear cart UI on buttons

            router.render();

            showToast("WhatsApp enquiry sent!");

        function handleExcelBulkImport() {

            const fileInput = document.getElementById('excel-file-input');

            if (!fileInput.files || fileInput.files.length === 0) {

                showToast("Please select an Excel file (.xlsx) first.", "error");

                return;

            }

            const file = fileInput.files[0];

            const reader = new FileReader();

            reader.onload = function(e) {

                try {

                    const data = new Uint8Array(e.target.result);

                    const workbook = XLSX.read(data, { type: 'array' });

                    const firstSheetName = workbook.SheetNames[0];

                    const worksheet = workbook.Sheets[firstSheetName];

                    const json = XLSX.utils.sheet_to_json(worksheet);



                    if (json && json.length > 0) {

                        const formatted = json.map((item, idx) => ({

                            id: Date.now() + idx,

                            name: item.name || "Unnamed Product",

                            category: item.category || "sparkles",

                            price: parseFloat(item.price) || 100,

                            discount: parseFloat(item.discount) || 0,

                            unit: item.unit || "1 Box",

                            image: item.image || "https://images.unsplash.com/photo-1513151233558-d860c5398176?w=400",

                            desc: item.desc || "Festive fireworks collection",

                            specs: "Standard Festival Grade",

                            safety: "Adult supervision required."

                        }));

                        productsData = [...formatted, ...productsData];

                        syncChangesToCloud();

                        showToast(`Successfully imported ${formatted.length} products from Excel!`);

                        router.render();

                    } else {

                        showToast("The Excel file is empty.", "error");

                    }

                } catch(err) {

                    showToast("Error parsing Excel file.", "error");

                }

            };

            reader.readAsArrayBuffer(file);

        }

        // Supabase Database Sync Functions

        async function loadDataFromSupabase() {

            try {

                const res = await fetch(`${SUPABASE_URL}/rest/v1/store_data?id=eq.1`, {

                    method: "GET",

                    headers: {

                        "apikey": SUPABASE_KEY,

                        "Authorization": `Bearer ${SUPABASE_KEY}`,

                        "Content-Type": "application/json"

                    }

                });

                const rows = await res.json();

                if (rows && rows.length > 0 && rows[0].content) {

                    const data = rows[0].content;

                    if(data.siteSettings) {

                        siteSettings = data.siteSettings;

                        const logoContainer = document.getElementById('brand-logo-container');

                        if(logoContainer && siteSettings.logoUrl) {

                            logoContainer.innerHTML = `<img src="${siteSettings.logoUrl}" class="w-full h-full object-cover">`;

                        }

                    }

                    if(data.businessInfo) businessInfo = data.businessInfo;

                    if(data.categoriesList) categoriesList = data.categoriesList;

                    if(data.productsData) productsData = data.productsData;

                    if(data.faqsData) faqsData = data.faqsData;

                    if(data.safetyPointsData) safetyPointsData = data.safetyPointsData;



                    const headerBrand = document.getElementById('brand-title-header');

                    if(headerBrand && siteSettings.brandName) headerBrand.innerText = siteSettings.brandName;



                    router.render();

                }

            } catch (err) {

                console.log("Error loading from Supabase", err);

            }

        }



        async function syncChangesToCloud() {

            showToast("Syncing changes live to Supabase...", "info");

            try {

                const payload = { 

                    id: 1, 

                    content: { siteSettings, businessInfo, categoriesList, productsData, faqsData, safetyPointsData } 

                };



                const res = await fetch(`${SUPABASE_URL}/rest/v1/store_data`, {

                    method: "POST",

                    headers: {

                        "apikey": SUPABASE_KEY,

                        "Authorization": `Bearer ${SUPABASE_KEY}`,

                        "Content-Type": "application/json",

                        "Prefer": "resolution=merge-duplicates"

                    },

                    body: JSON.stringify(payload)

                });



                if (res.ok) {

                    showToast("Changes successfully saved to Supabase!");

                } else {

                    const errText = await res.text();

                    console.error("Supabase sync error:", errText);

                    showToast("Failed to sync with cloud", "error");

                }

            } catch (err) {

                console.error("Network error during sync", err);

                showToast("Network error during sync", "error");

            }

        }



        window.onload = async function() {
            await loadDataFromSupabase();
            if (window.location.hash === '#admin') {
                router.navigate('admin');
            } else {
                router.navigate('home');
            }
            applyDynamicSettings();
            // Show Popup on first visit
            if (!sessionStorage.getItem('popupShown')) {
                if (siteSettings && siteSettings.popupMessage) {
                    document.getElementById('promo-popup-text').innerText = siteSettings.popupMessage;
                }
                
                setTimeout(() => {
                    openPromoPopup();
                    sessionStorage.setItem('popupShown', 'true');
                }, 1000);
            }
        };
