        // Owner Modal Logic
        function openOwnerModal(id) {
            const owner = ownerSettings.owners.find(o => o.id === id);

            document.getElementById('modal-owner-img').src = owner.image;
            document.getElementById('modal-owner-name').innerText = owner.name;
            document.getElementById('modal-owner-role').innerText = owner.role;
            document.getElementById('modal-owner-bio').innerText = owner.bio;
            
            const li = document.getElementById('modal-owner-li');
            const wa = document.getElementById('modal-owner-wa');
            if(owner.linkedin) { li.href = owner.linkedin; li.classList.remove('hidden'); } else { li.classList.add('hidden'); }
            if(owner.whatsapp) { wa.href = `https://wa.me/${owner.whatsapp}`; wa.classList.remove('hidden'); } else { wa.classList.add('hidden'); }
            
            const modal = document.getElementById('owner-modal');
            const content = document.getElementById('owner-modal-content');
            modal.classList.remove('hidden');
            content.classList.remove('owner-modal-enter-active');

        function getCardActionHTML(productId) {
            const item = cart.find(i => i.id === productId);
            if (item && item.qty > 0) {
                return `
                    <div class="flex items-center justify-between bg-slate-100 dark:bg-slate-800 rounded-xl overflow-hidden h-full">
                        <button onclick="event.stopPropagation(); updateCartQty(${productId}, -1);" class="px-2 sm:px-3 py-2 text-brand hover:bg-slate-200 dark:hover:bg-slate-700 font-bold w-1/3 text-center">-</button>
                        <span class="text-[10px] sm:text-xs font-bold text-slate-800 dark:text-slate-200 w-1/3 text-center">${item.qty}</span>
                        <button onclick="event.stopPropagation(); updateCartQty(${productId}, 1);" class="px-2 sm:px-3 py-2 text-brand hover:bg-slate-200 dark:hover:bg-slate-700 font-bold w-1/3 text-center">+</button>
                    </div>
                `;
            }
            return `
                <button onclick="event.stopPropagation(); addToCart(${productId});" class="bg-brand hover:bg-brandHover text-white text-[10px] sm:text-xs font-bold py-2 rounded-xl shadow-md transition flex items-center justify-center w-full h-full">

                </button>

        }

        function renderProductCard(p) {
            const discountPercentage = p.discount || 0;
            const finalPrice = discountPercentage ? Math.round(p.price - (p.price * discountPercentage / 100)) : p.price;

            const priceHtml = discountPercentage
                ? `<span class="text-[10px] sm:text-xs text-slate-400 line-through mr-1">₹${p.price}</span><span class="text-sm sm:text-lg font-extrabold text-brand">₹${finalPrice}</span>`
                : `<span class="text-sm sm:text-lg font-extrabold text-brand">₹${p.price}</span>`;

            return `
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl overflow-hidden shadow-sm hover:shadow-xl transition flex flex-col justify-between">
                    <div>
                        <div class="relative h-32 sm:h-48 bg-slate-100 overflow-hidden cursor-pointer" onclick="router.navigate('product-detail', ${p.id})">
                            <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            ${discountBadge}
                        </div>
                        <div class="p-3 sm:p-5 space-y-1">
                            <h3 class="font-bold text-xs sm:text-base cursor-pointer hover:text-brand line-clamp-1" onclick="router.navigate('product-detail', ${p.id})">${p.name}</h3>
                            <div class="flex items-center justify-between pt-1">
                                <span class="text-[9px] sm:text-xs font-semibold text-slate-400">${p.unit}</span>
                                <div class="text-right">${priceHtml}</div>
                            </div>
                        </div>
                    </div>
                    <div class="p-3 sm:p-5 pt-0 grid grid-cols-2 gap-1.5 sm:gap-2">
                        <button onclick="router.navigate('product-detail', ${p.id})" class="bg-slate-100 dark:bg-slate-800 text-[10px] sm:text-xs font-semibold py-2 rounded-xl text-center">View</button>
                        <div class="card-action-${p.id}">${getCardActionHTML(p.id)}</div>
                    </div>
                </div>
            `;
        }

        let selectedCategoryFilter = 'all';
        let searchQuery = '';

        function renderCatalogueView(initialCat = null) {
            if (initialCat !== null && initialCat !== 'all') selectedCategoryFilter = initialCat;
            const filteredProducts = productsData.filter(p => (selectedCategoryFilter === 'all' || p.category === selectedCategoryFilter) && p.name.toLowerCase().includes(searchQuery.toLowerCase()));

            return `
                <div class="max-w-7xl mx-auto px-4 py-10 space-y-8">
                    <h1 class="text-3xl font-extrabold">Shop Fireworks</h1>

                        <button onclick="setCategoryFilter('all')" class="whitespace-nowrap px-4 py-2 rounded-xl text-xs font-bold transition ${selectedCategoryFilter === 'all' ? 'bg-brand text-white shadow-md' : 'bg-white border text-slate-600'}">All Products</button>

                            <button onclick="setCategoryFilter('${c.key}')" class="whitespace-nowrap px-4 py-2 rounded-xl text-xs font-bold transition ${selectedCategoryFilter === c.key ? 'bg-brand text-white shadow-md' : 'bg-white border text-slate-600'}">${c.name}</button>

                    </div>
                </div>
            `;
        }

        function setCategoryFilter(cat) { selectedCategoryFilter = cat; router.render(); }

        // Cart Drawer Logic
        function startCartTimer() {
            if(!timerSettings.enabled) return;
            document.getElementById('cart-timer-container').classList.remove('hidden');
            checkoutTimerSeconds = timerSettings.minutes * 60;
            if(checkoutTimerInterval) clearInterval(checkoutTimerInterval);
            checkoutTimerInterval = setInterval(() => {
                checkoutTimerSeconds--;
                if(checkoutTimerSeconds <= 0) {
                    clearInterval(checkoutTimerInterval);
                    cart = []; updateCartBadge(); closeCartDrawer(); router.render();
                    showToast("Cart session expired. Items cleared.", "error");
                }
                const m = Math.floor(checkoutTimerSeconds / 60).toString().padStart(2, '0');
                const s = (checkoutTimerSeconds % 60).toString().padStart(2, '0');
                const disp = document.getElementById('cart-timer-display');
                if(disp) disp.innerText = `${m}:${s}`;
            }, 1000);
        }

        function openCartDrawer() {
            checkoutStep = 'form';
            document.getElementById('cart-drawer').classList.remove('hidden');
            if(timerSettings.enabled && cart.length > 0 && checkoutTimerSeconds <= 0) startCartTimer();
            renderCartDrawerContent();
        }

        function closeCartDrawer() { document.getElementById('cart-drawer').classList.add('hidden'); }

        function addToCart(productId, qty = 1) {
            const product = productsData.find(p => p.id === productId);
            if (!product) return;
            const existing = cart.find(i => i.id === productId);
            if (existing) { existing.qty += qty; } else { cart.push({ ...product, qty: qty }); }
            updateCartBadge(); refreshCardAction(productId);
        }
        function updateCartQty(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (item) { item.qty += delta; if (item.qty <= 0) cart = cart.filter(i => i.id !== productId); }
            updateCartBadge(); renderCartDrawerContent(); refreshCardAction(productId);
        }
        function refreshCardAction(productId) {
            document.querySelectorAll(`.card-action-${productId}`).forEach(el => el.innerHTML = getCardActionHTML(productId));
        }
        function updateCartBadge() {
            const totalCount = cart.reduce((sum, i) => sum + i.qty, 0);
            document.querySelectorAll('#cart-badge, #mobile-cart-badge').forEach(b => {
                if (totalCount > 0) { b.innerText = totalCount; b.classList.remove('hidden'); } else { b.classList.add('hidden'); }
            });
            const hc = document.getElementById('cart-count-header'); if(hc) hc.innerText = totalCount;
            if(totalCount === 0 && checkoutTimerInterval) { clearInterval(checkoutTimerInterval); checkoutTimerSeconds=0; document.getElementById('cart-timer-container').classList.add('hidden'); }
        }

        function renderCartDrawerContent() {
            const container = document.getElementById('cart-drawer-body');
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-20"><h4 class="font-bold text-lg">Your cart is empty</h4><button onclick="closeCartDrawer(); router.navigate('catalogue')" class="mt-4 bg-brand text-white font-bold text-xs px-6 py-3 rounded-xl">Shop Products</button></div>`;
                return;
            }

            const totalMrp = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const totalDiscount = cart.reduce((sum, item) => sum + ((item.discount || 0) ? (item.price * item.discount / 100) * item.qty : 0), 0);
            const subtotal = Math.round(totalMrp - totalDiscount);

            if (checkoutStep === 'form') {
                // Step 1: Hide Discount breakdown per instruction
                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="space-y-3 max-h-96 overflow-y-auto pr-2">
                            ${cart.map(item => `
                                <div class="flex items-center justify-between p-3 rounded-2xl bg-slate-50 border border-slate-200">

                                    </div>
                                    <div class="flex items-center space-x-2">
                                        <div class="flex items-center border rounded-lg bg-white">
                                            <button onclick="updateCartQty(${item.id}, -1)" class="px-2 py-1 text-xs font-bold">-</button>
                                            <span class="px-2 text-xs font-bold">${item.qty}</span>
                                            <button onclick="updateCartQty(${item.id}, 1)" class="px-2 py-1 text-xs font-bold">+</button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="pt-4 border-t space-y-1">
                            <div class="flex justify-between font-extrabold text-base pt-2">
                                <span>Estimated Total:</span><span class="text-brand">₹${totalMrp}</span>
                            </div>
                        </div>
                        <button onclick="checkoutStep='details'; renderCartDrawerContent();" class="w-full mt-4 bg-brand hover:bg-brandHover text-white font-bold py-3 rounded-xl shadow-lg transition text-xs uppercase tracking-wider">Proceed to Details <i class="fa-solid fa-arrow-right ml-2"></i></button>
                    </div>
                `;
            } else if (checkoutStep === 'details') {
                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex items-center justify-between pb-2 border-b"><h4 class="font-bold text-sm text-brand uppercase">Details</h4><button onclick="checkoutStep='form'; renderCartDrawerContent();" class="text-xs font-bold text-slate-400 hover:text-brand"><i class="fa-solid fa-arrow-left"></i> Back</button></div>
                        <form onsubmit="event.preventDefault(); checkoutStep='summary'; renderCartDrawerContent();" class="space-y-3">
                            <div><label class="block text-xs font-semibold mb-1">Name *</label><input type="text" id="form-name" required value="${customerDetails.name}" onchange="customerDetails.name=this.value" class="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs"></div>
                            <div><label class="block text-xs font-semibold mb-1">Mobile *</label><input type="tel" required value="${customerDetails.mobile}" onchange="customerDetails.mobile=this.value" class="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs"></div>
                            <button type="submit" class="w-full mt-4 bg-brand text-white font-bold py-3 rounded-xl uppercase tracking-wider text-xs">Review Enquiry <i class="fa-solid fa-arrow-right"></i></button>
                        </form>
                    </div>
                `;
            } else {
                // Step 3: Show massive discount logic per instruction
                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="bg-slate-50 border p-4 rounded-2xl space-y-2">
                            <h4 class="font-bold text-xs uppercase text-brand">Summary</h4>
                            <p class="text-xs font-medium">${customerDetails.name} | ${customerDetails.mobile}</p>
                        </div>
                        <div class="p-6 rounded-2xl bg-brand/10 border border-brand/20 flex flex-col items-center justify-center text-center space-y-2">
                            <span class="text-sm font-bold text-slate-600">Total Value:</span>
                            ${totalDiscount > 0 ? `<span class="line-through text-slate-400 text-lg">₹${totalMrp}</span>` : ''}
                            <span class="text-4xl font-black text-brand">₹${subtotal}</span>
                            ${totalDiscount > 0 ? `<span class="bg-emerald-500 text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase mt-2">You Save ₹${Math.round(totalDiscount)}!</span>` : ''}
                        </div>
                        <button onclick="sendWhatsAppTextEnquiry()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-sm uppercase flex items-center justify-center"><i class="fa-brands fa-whatsapp text-lg mr-2"></i> Send Enquiry via WhatsApp</button>
                        <button onclick="checkoutStep='details'; renderCartDrawerContent();" class="w-full bg-slate-200 text-slate-700 font-semibold py-2.5 rounded-xl text-xs">Back</button>
                    </div>
                `;
            }
        }
        function sendWhatsAppTextEnquiry() {
            cart=[]; updateCartBadge(); closeCartDrawer(); router.render(); showToast("Enquiry sent!");

                            <div class="space-y-4">
                                <div><label class="block text-xs">Brand Name</label><input type="text" value="${siteSettings.brandName}" onchange="siteSettings.brandName=this.value" class="w-full border rounded-xl px-3 py-2 text-xs"></div>
                                <div><label class="block text-xs">Brand Subtitle (Store Title)</label><input type="text" value="${siteSettings.brandSubTitle}" onchange="siteSettings.brandSubTitle=this.value" class="w-full border rounded-xl px-3 py-2 text-xs"></div>
                                <div><label class="block text-xs">Hero Heading</label><input type="text" value="${siteSettings.heroHeading}" onchange="siteSettings.heroHeading=this.value" class="w-full border rounded-xl px-3 py-2 text-xs"></div>
                                <button onclick="router.render(); showToast('Saved');" class="bg-brand text-white px-4 py-2 rounded font-bold text-xs">Save</button>
                            </div>
                        </div>
                    </div>

                </div>
            `;
        }

        // Admin Functions mapping
        function setAdminTab(tab) { currentAdminTab = tab; router.render(); }
        
        function toggleSelectAll(checked) {
            document.querySelectorAll('.prod-checkbox').forEach(cb => cb.checked = checked);
        }
        function bulkDeleteSelected() {
            const checked = Array.from(document.querySelectorAll('.prod-checkbox:checked')).map(cb => parseInt(cb.value));
            if(checked.length === 0) return;
            if(confirm(`Delete ${checked.length} products?`)) {
                productsData = productsData.filter(p => !checked.includes(p.id));
                router.render(); showToast("Deleted");
            }
        }
        function deleteAllProducts() {
            if(confirm("DANGER: Delete ALL products?")) {
                productsData = []; router.render(); showToast("All products deleted", "error");
            }
        }
        function deleteProduct(id) {
            if(confirm("Delete this product?")) { productsData = productsData.filter(p => p.id !== id); router.render(); }
        }
        
        function toggleFeaturedProduct(id, isChecked) {
            if(isChecked) { if(!featuredProductsList.includes(id)) featuredProductsList.push(id); }
            else { featuredProductsList = featuredProductsList.filter(fid => fid !== id); }
        }

        function addOwnerProfile() {
            const name = prompt("Enter Owner Name:");
            if(!name) return;
            const role = prompt("Enter Role:");
            const bio = prompt("Enter Bio:");
            ownerSettings.owners.push({ id: Date.now(), name, role, bio, image: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=200", linkedin: "", whatsapp: "" });
            router.render();
        }
        function deleteOwnerProfile(id) {
            ownerSettings.owners = ownerSettings.owners.filter(o => o.id !== id); router.render();
        }

        function updateThemeColor(hex) {
            siteSettings.themeColor = hex;
            document.documentElement.style.setProperty('--brand-color', hex);
            document.documentElement.style.setProperty('--brand-hover', hex); // Simplified for brevity
            showToast("Theme Color Updated!");
        }

        window.onload = function() {
            // Apply theme color on load
            document.documentElement.style.setProperty('--brand-color', siteSettings.themeColor);
            document.documentElement.style.setProperty('--brand-hover', siteSettings.themeColor); // Ideally slightly darker
            if (window.location.hash) {
                const route = window.location.hash.replace('#', '').split('/')[0];
                router.navigate(route || 'home', null, false);
            } else { router.navigate('home', null, false); }
        };
    </script>
</body>
</html>
