                window.scrollTo({ top: 0, behavior: 'smooth' });
                this.render();
                updateActiveNavStyles();
            },
            render: function() {
                const main = document.getElementById('app-main');
                if (currentRoute === 'home') main.innerHTML = renderHomeView();
                else if (currentRoute === 'catalogue') main.innerHTML = renderCatalogueView(currentRouteParam);
                else if (currentRoute === 'product-detail') main.innerHTML = renderProductDetailView(parseInt(currentRouteParam));
                else if (currentRoute === 'safety') main.innerHTML = renderSafetyView();
                else if (currentRoute === 'compliance') main.innerHTML = renderComplianceView();
                else if (currentRoute === 'faq') main.innerHTML = renderFaqView();
                else if (currentRoute === 'contact') main.innerHTML = renderContactView();
                else if (currentRoute === 'admin') main.innerHTML = renderAdminView();
                else main.innerHTML = renderHomeView();
            }
        };

        });

        let selectedCategoryFilter = 'all';

            const filteredProducts = productsData.filter(p => {
                const matchesCat = selectedCategoryFilter === 'all' || p.category === selectedCategoryFilter;

        function handleSearchInput(val) {

        }

        function renderProductDetailView(productId) {
            const product = productsData.find(p => p.id === productId) || productsData[0];
            const discountPercentage = product.discount || 0;
            const finalPrice = discountPercentage ? Math.round(product.price - (product.price * discountPercentage / 100)) : product.price;

            return `
                <div class="max-w-7xl mx-auto px-4 py-10 space-y-8">
                    <button onclick="window.history.back()" class="inline-flex items-center text-sm font-semibold text-amber-600 dark:text-amber-400 hover:underline">
                        <i class="fa-solid fa-arrow-left mr-2"></i> Back
                    </button>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 bg-white dark:bg-slate-900 border p-6 md:p-10 rounded-3xl shadow-sm">
                        <div class="relative h-80 sm:h-96 rounded-2xl overflow-hidden bg-slate-100 dark:bg-slate-800">
                            <img src="${product.image}" class="w-full h-full object-cover">
                            ${discountPercentage ? `<span class="absolute top-4 left-4 bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg">-${discountPercentage}% OFF</span>` : ''}
                        </div>

                        <div class="space-y-6 flex flex-col justify-between">
                            <div class="space-y-4">
                                <span class="bg-amber-50 text-amber-600 border border-amber-200 text-xs font-bold px-3 py-1 rounded-full uppercase">${product.category}</span>
                                <h1 class="text-3xl sm:text-4xl font-extrabold">${product.name}</h1>
                                <p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed">${product.desc}</p>
                                <div class="text-3xl font-extrabold text-amber-600 pt-2">
                                    ${discountPercentage ? `<span class="text-xl text-slate-400 line-through mr-2">₹${product.price}</span>` : ''}
                                    ₹${finalPrice} <span class="text-xs font-normal text-slate-400">(${product.unit})</span>
                                </div>
                            </div>

                            <div class="pt-6 border-t flex items-center space-x-4">
                                <div class="flex items-center border rounded-xl overflow-hidden bg-slate-50 dark:bg-slate-800">
                                    <button onclick="decrementDetailQty(${product.id})" class="px-4 py-3 hover:bg-slate-200 font-bold">-</button>
                                    <span id="detail-qty-${product.id}" class="px-4 font-bold text-sm">1</span>
                                    <button onclick="incrementDetailQty(${product.id})" class="px-4 py-3 hover:bg-slate-200 font-bold">+</button>
                                </div>
                                <button onclick="addToCartWithQty(${product.id})" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg flex items-center justify-center space-x-2">
                                    <i class="fa-solid fa-cart-plus"></i><span>Add to Cart</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        let detailQtyMap = {};
        function incrementDetailQty(id) { let c = detailQtyMap[id] || 1; detailQtyMap[id] = ++c; document.getElementById(`detail-qty-${id}`).innerText = c; }
        function decrementDetailQty(id) { let c = detailQtyMap[id] || 1; if(c>1)c--; detailQtyMap[id] = c; document.getElementById(`detail-qty-${id}`).innerText = c; }

        function addToCart(productId, qty = 1) {
            const product = productsData.find(p => p.id === productId);
            if (!product) return;
            const existing = cart.find(item => item.id === productId);
            if (existing) { existing.qty += qty; } else { cart.push({ ...product, qty: qty }); }
            updateCartBadge();
            refreshCardAction(productId);
        }

        function addToCartWithQty(productId) {
            addToCart(productId, detailQtyMap[productId] || 1);
            openCartDrawer();
        }

        function updateCartBadge() {
            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            document.querySelectorAll('#cart-badge, #mobile-cart-badge').forEach(b => {
                if (totalCount > 0) { b.innerText = totalCount; b.classList.remove('hidden'); } else { b.classList.add('hidden'); }
            });
            const hc = document.getElementById('cart-count-header'); if(hc) hc.innerText = totalCount;
        }

        function openCartDrawer() {
            checkoutStep = 'form'; 
            document.getElementById('cart-drawer').classList.remove('hidden');
            renderCartDrawerContent();
        }

        function closeCartDrawer() {
            document.getElementById('cart-drawer').classList.add('hidden');
            clearInterval(cartTimerInterval);
        }

        function updateCartQty(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (item) { item.qty += delta; if (item.qty <= 0) cart = cart.filter(i => i.id !== productId); }
            updateCartBadge();
            renderCartDrawerContent();
            refreshCardAction(productId);
        }

        function removeFromCart(productId) {
            cart = cart.filter(i => i.id !== productId);
            updateCartBadge();
            renderCartDrawerContent();
            refreshCardAction(productId);
            showToast("Item removed", "info");
        }

        function startCartTimer() {
            if(!timerSettings.enabled) return;
            clearInterval(cartTimerInterval);
            let time = timerSettings.minutes * 60;
            const displays = document.querySelectorAll('.checkout-timer-display');
            if(displays.length === 0) return;
            cartTimerInterval = setInterval(() => {
                time--;
                let m = Math.floor(time / 60); let s = time % 60;
                displays.forEach(el => { el.innerText = `${m}:${s<10?'0':''}${s}`; });
                if(time <= 0) { 
                    clearInterval(cartTimerInterval); cart = []; closeCartDrawer(); updateCartBadge(); router.render();
                    showToast("Checkout session expired", "error"); 
                }
            }, 1000);
        }

        // The exact checkout flow requested
        function renderCartDrawerContent() {
            const container = document.getElementById('cart-drawer-body');
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-20 space-y-4"><i class="fa-solid fa-cart-shopping text-3xl text-slate-300"></i><h4 class="font-bold text-lg">Your cart is empty</h4><button onclick="closeCartDrawer(); router.navigate('catalogue')" class="bg-amber-600 text-white font-bold text-xs px-6 py-3 rounded-xl">Shop Products</button></div>`;
                return;
            }

            const totalMrp = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const totalDiscount = cart.reduce((sum, item) => sum + ((item.discount || 0) ? (item.price * item.discount / 100) * item.qty : 0), 0);
            const subtotal = Math.round(totalMrp - totalDiscount);

            let timerHtml = timerSettings.enabled && checkoutStep !== 'form' ? `
                <div class="bg-red-50 text-red-600 p-2 text-center text-xs font-bold rounded-xl mb-3 flex items-center justify-center space-x-2 border border-red-200">
                    <i class="fa-solid fa-clock"></i> <span>Time left: <span class="checkout-timer-display">${timerSettings.minutes}:00</span></span>
                </div>
            ` : '';

            // PAGE 1: No discounts shown, only MRP
            if (checkoutStep === 'form') {
                container.innerHTML = `
                    <div class="space-y-4">
                        <h4 class="font-bold text-sm text-slate-400 uppercase tracking-wider">Selected Items</h4>
                        <div class="space-y-3 max-h-96 overflow-y-auto pr-2">
                            ${cart.map(item => `
                                <div class="flex items-center justify-between p-3 rounded-2xl bg-slate-50 border border-slate-200 dark:bg-slate-800 dark:border-slate-700">
                                    <div class="flex items-center space-x-3">
                                        <img src="${item.image}" class="w-12 h-12 rounded-xl object-cover">
                                        <div><h5 class="font-bold text-xs line-clamp-1">${item.name}</h5><span class="text-[10px] text-slate-400">₹${item.price} x${item.qty}</span></div>
                                    </div>
                                    <div class="flex items-center space-x-2">
                                        <div class="flex items-center border rounded-lg overflow-hidden bg-white dark:bg-slate-900">
                                            <button onclick="updateCartQty(${item.id}, -1)" class="px-2 py-1 text-xs font-bold">-</button>
                                            <span class="px-2 text-xs font-bold">${item.qty}</span>
                                            <button onclick="updateCartQty(${item.id}, 1)" class="px-2 py-1 text-xs font-bold">+</button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="pt-4 border-t border-slate-200 flex justify-between font-extrabold text-base">
                            <span>Estimated Subtotal:</span><span class="text-slate-800 dark:text-white">₹${Math.round(totalMrp)}</span>
                        </div>
                        <button onclick="checkoutStep='details'; renderCartDrawerContent();" class="w-full mt-4 bg-amber-600 text-white font-bold py-3 rounded-xl shadow-lg transition text-xs uppercase tracking-wider">
                            Proceed to Details <i class="fa-solid fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                `;
            } 
            // PAGE 2: Details input
            else if (checkoutStep === 'details') {
                container.innerHTML = `
                    ${timerHtml}
                    <div class="space-y-4">
                        <div class="flex items-center justify-between pb-2 border-b">
                            <h4 class="font-bold text-sm text-amber-600 uppercase tracking-wider">Customer Details</h4>
                            <button onclick="checkoutStep='form'; renderCartDrawerContent();" class="text-xs font-bold text-slate-400 hover:text-amber-600"><i class="fa-solid fa-arrow-left"></i> Back</button>
                        </div>
                        <form onsubmit="handleCustomerFormSubmit(event)" class="space-y-3">
                            <input type="text" id="form-name" value="${customerDetails.name}" placeholder="Name *" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-xs bg-slate-50 dark:bg-slate-800">
                            <input type="tel" id="form-mobile" value="${customerDetails.mobile}" placeholder="Mobile *" maxlength="10" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-xs bg-slate-50 dark:bg-slate-800">
                            <input type="email" id="form-email" value="${customerDetails.email}" placeholder="Email" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-xs bg-slate-50 dark:bg-slate-800">
                            <textarea id="form-address" rows="2" placeholder="Address *" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs bg-slate-50 dark:bg-slate-800">${customerDetails.address}</textarea>
                            <div class="grid grid-cols-2 gap-2">
                                <input type="text" id="form-city" value="${customerDetails.city}" placeholder="City *" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs bg-slate-50 dark:bg-slate-800">
                                <input type="text" id="form-pincode" value="${customerDetails.pincode}" placeholder="Pincode *" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs bg-slate-50 dark:bg-slate-800">
                            </div>
                            <button type="submit" class="w-full mt-4 bg-amber-600 text-white font-bold py-3 rounded-xl shadow-lg transition text-xs uppercase tracking-wider">
                                View Enquiry Summary <i class="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        </form>
                    </div>
                `;
                if(timerSettings.enabled && !cartTimerInterval) startCartTimer();
            } 
            // PAGE 3: Final Summary - BIG DISCOUNT REVEAL
            else {
                container.innerHTML = `
                    ${timerHtml}
                    <div class="space-y-6">
                        <div class="bg-amber-50 dark:bg-amber-900/20 p-4 rounded-2xl border border-amber-100 dark:border-amber-800">
                            <div class="flex items-center justify-between"><h4 class="font-bold text-xs uppercase text-amber-600">Info</h4><button onclick="checkoutStep='details'; renderCartDrawerContent();" class="text-xs font-bold text-amber-600 underline">Edit</button></div>
                            <p class="text-xs mt-2">${customerDetails.name} | ${customerDetails.mobile}</p>
                            <p class="text-xs">${customerDetails.address}, ${customerDetails.city}</p>
                        </div>
                        <div class="p-6 rounded-3xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-center shadow-inner relative overflow-hidden">
                            ${totalDiscount > 0 ? `<div class="absolute top-0 right-0 bg-red-600 text-white text-[10px] font-bold px-3 py-1 rounded-bl-xl">Discount Applied</div>` : ''}
                            <p class="text-xs text-slate-500 line-through mb-1 font-bold">Total MRP: ₹${Math.round(totalMrp)}</p>
                            <h2 class="text-5xl font-black text-amber-600 mb-2">₹${subtotal}</h2>
                            ${totalDiscount > 0 ? `<p class="text-sm text-emerald-600 font-extrabold uppercase tracking-wider">You Saved ₹${Math.round(totalDiscount)}!</p>` : ''}
                        </div>
                        <button onclick="sendWhatsAppTextEnquiry()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-lg transition text-sm uppercase tracking-wider flex items-center justify-center space-x-2">
                            <i class="fa-brands fa-whatsapp text-xl"></i> <span>Send via WhatsApp</span>
                        </button>
                    </div>
                `;
                if(timerSettings.enabled && !cartTimerInterval) startCartTimer();
            }
        }

        function handleCustomerFormSubmit(e) {
            e.preventDefault();
            customerDetails = {
                name: document.getElementById('form-name').value.trim(), mobile: document.getElementById('form-mobile').value.trim(),
                email: document.getElementById('form-email').value.trim(), address: document.getElementById('form-address').value.trim(),
                city: document.getElementById('form-city').value.trim(), pincode: document.getElementById('form-pincode').value.trim()
            };
            if(!customerDetails.name || !customerDetails.mobile) { showToast("Name and Mobile are required.", "error"); return; }
            checkoutStep = 'summary'; renderCartDrawerContent();
        }

        function sendWhatsAppTextEnquiry() {
            const totalMrp = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const totalDiscount = cart.reduce((sum, item) => sum + ((item.discount || 0) ? (item.price * item.discount / 100) * item.qty : 0), 0);
            const subtotal = Math.round(totalMrp - totalDiscount);

            let itemsText = cart.map(i => {
                const finalP = i.discount ? Math.round(i.price - (i.price * i.discount / 100)) : i.price;
                return `- ${i.name} (${i.unit}) x ${i.qty} = ₹${finalP * i.qty}`;
            }).join('\n');

            const message = encodeURIComponent(`*New Enquiry - ${siteSettings.brandName}*\n\nName: ${customerDetails.name}\nMobile: ${customerDetails.mobile}\n\n*Items:*\n${itemsText}\n\n*Total MRP:* ₹${Math.round(totalMrp)}\n*Total Savings:* ₹${Math.round(totalDiscount)}\n*Final Total:* ₹${subtotal}`);
            window.open(`https://wa.me/91${siteSettings.whatsappNumber}?text=${message}`, '_blank');
            cart = []; checkoutStep = 'form'; updateCartBadge(); closeCartDrawer(); router.render();
            showToast("Enquiry sent via WhatsApp!");
        }

        function openMobileMenu() { document.getElementById('mobile-menu-modal').classList.remove('hidden'); }
        function closeMobileMenu() { document.getElementById('mobile-menu-modal').classList.add('hidden'); }

        function renderSafetyView() { return `<div class="p-10 text-center"><h1 class="text-3xl font-extrabold mb-4">Safety Centre</h1><p>Follow guidelines issued by safety authorities.</p></div>`; }
        function renderComplianceView() { return `<div class="p-10 text-center"><h1 class="text-3xl font-extrabold mb-4">Compliance</h1><p>${businessInfo.license}</p></div>`; }
        function renderFaqView() { return `<div class="p-10 text-center"><h1 class="text-3xl font-extrabold mb-4">FAQs</h1></div>`; }
        function renderContactView() { return `<div class="p-10 text-center"><h1 class="text-3xl font-extrabold mb-4">Contact Us</h1></div>`; }

                            <div class="bg-white dark:bg-slate-900 border p-6 rounded-3xl"><p class="text-xs text-slate-400">Featured Display</p><h3 class="text-2xl font-black">${siteSettings.featuredProducts?.length || 0}</h3></div>

                            <div class="flex justify-between border-b pb-2 bg-slate-50 dark:bg-slate-800 p-2 rounded">
                                <label class="text-xs font-bold flex items-center gap-2 cursor-pointer"><input type="checkbox" onchange="toggleSelectAllProducts(this.checked)" class="w-4 h-4"> Select All</label>

                                <tbody>${filteredInventory.map(p=>`<tr class="border-b hover:bg-slate-50 dark:hover:bg-slate-800"><td class="p-3"><input type="checkbox" class="prod-check w-4 h-4" value="${p.id}"></td><td class="p-3"><img src="${p.image}" class="w-8 h-8 rounded object-cover"></td><td class="p-3 font-bold">${p.name}</td><td class="p-3">₹${p.price}</td><td class="p-3 text-emerald-600 font-bold">${p.discount||0}%</td><td class="p-3"><button onclick="openEditProductModal(${p.id})" class="text-blue-500 font-bold mr-3">Edit</button><button onclick="deleteProduct(${p.id})" class="text-red-500 font-bold">Delete</button></td></tr>`).join('')}</tbody></table>

                        <div class="bg-white dark:bg-slate-900 border p-6 rounded-3xl space-y-4 max-w-4xl">
                            <h3 class="font-bold">Select Featured Products for Homepage</h3>
                            <p class="text-xs text-slate-500 mb-4">Check the boxes to force products onto the homepage Featured list.</p>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 max-h-[400px] overflow-auto p-2">
                                ${productsData.map(p=> `
                                    <label class="flex items-center gap-3 p-3 border rounded-xl cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800">
                                        <input type="checkbox" onchange="toggleFeatured('${p.id}', this.checked)" class="w-4 h-4 text-amber-600" ${siteSettings.featuredProducts?.includes(p.id.toString())?'checked':''}>
                                        <span class="text-xs font-bold line-clamp-1">${p.name}</span>
                                    </label>
                                `).join('')}
                            </div>
                            <button onclick="syncChangesToCloud(); showToast('Featured list saved!');" class="bg-amber-600 hover:bg-amber-700 text-white px-6 py-3 rounded-xl text-xs font-bold uppercase mt-4 w-full">Save Featured Selection</button>
                        </div>
                    ` : ''}

                    ${currentAdminTab === 'timer' ? `
                        <div class="bg-white dark:bg-slate-900 border p-8 rounded-3xl max-w-lg space-y-4">
                            <h3 class="font-bold text-lg mb-2">Cart Checkout Timer</h3>
                            <label class="flex items-center gap-3 font-bold text-sm cursor-pointer"><input type="checkbox" id="timer-en" class="w-5 h-5" ${timerSettings.enabled?'checked':''}> Enable Checkout Timer</label>
                            <div><label class="block text-xs font-semibold mb-1 mt-3">Timer Duration (Minutes)</label><input type="number" id="timer-min" value="${timerSettings.minutes}" class="w-full border rounded-xl px-4 py-2 bg-slate-50 dark:bg-slate-800 text-sm"></div>
                            <button onclick="timerSettings.enabled=document.getElementById('timer-en').checked; timerSettings.minutes=document.getElementById('timer-min').value; syncChangesToCloud(); showToast('Timer saved!');" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl mt-4">Save Timer Settings</button>
                        </div>
                    ` : ''}

                    ${currentAdminTab === 'owners' ? `
                        <div class="bg-white dark:bg-slate-900 border p-8 rounded-3xl max-w-3xl space-y-6">
                            <div class="flex justify-between items-center border-b pb-4">
                                <h3 class="font-bold text-lg">Owner & Team Management</h3>
                                <label class="flex items-center gap-2 text-sm font-bold bg-slate-100 dark:bg-slate-800 py-1.5 px-3 rounded-lg cursor-pointer"><input type="checkbox" id="ow-en-toggle" ${ownerSettings.enabled?'checked':''} onchange="ownerSettings.enabled=this.checked; syncChangesToCloud();"> Display on Home</label>
                            </div>
                            <div class="bg-slate-50 dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
                                <h4 class="font-bold text-sm mb-3">Add New Member</h4>
                                <div class="grid grid-cols-2 gap-3 mb-3">
                                    <input type="text" id="ow-add-name" placeholder="Full Name *" class="border p-2 rounded text-xs bg-white dark:bg-slate-900">
                                    <input type="text" id="ow-add-role" placeholder="Role (e.g. Founder) *" class="border p-2 rounded text-xs bg-white dark:bg-slate-900">
                                    <input type="text" id="ow-add-img" placeholder="Image URL" class="border p-2 rounded text-xs bg-white dark:bg-slate-900 col-span-2">
                                </div>
                                <textarea id="ow-add-bio" rows="3" placeholder="Short Bio / Quote..." class="w-full border p-2 rounded text-xs mb-3 bg-white dark:bg-slate-900"></textarea>
                                <button onclick="addOwnerProfile()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2.5 rounded">Add Profile</button>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                ${ownerSettings.owners.map((o,i) => `
                                    <div class="flex items-center justify-between p-3 border rounded-xl bg-slate-50 dark:bg-slate-800">
                                        <div class="flex items-center gap-3">
                                            <img src="${o.image}" class="w-10 h-10 rounded-full object-cover border" onerror="this.src='https://placehold.co/100?text=User'">
                                            <div><p class="text-xs font-bold">${o.name}</p><p class="text-[10px] text-amber-600">${o.role}</p></div>
                                        </div>
                                        <button onclick="ownerSettings.owners.splice(${i},1); syncChangesToCloud(); router.render();" class="text-red-500 hover:text-red-700 p-2"><i class="fa-solid fa-trash-can"></i></button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                    
                    ${currentAdminTab === 'categories' ? `
                        <div class="bg-white dark:bg-slate-900 border p-6 rounded-3xl max-w-3xl space-y-6">
                            <div class="flex justify-between border-b pb-4"><h3 class="font-bold flex items-center"><i class="fa-solid fa-folder-tree text-amber-600 mr-2"></i> Categories</h3><button onclick="openAddCategoryModal()" class="bg-amber-600 text-white text-xs font-bold px-4 py-2 rounded-xl hover:bg-amber-700">+ Add</button></div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                ${categoriesList.map(c => `
                                    <div class="flex items-center justify-between p-4 rounded-xl border bg-slate-50 dark:bg-slate-800">
                                        <div class="flex items-center space-x-3"><img src="${c.image}" class="w-10 h-10 rounded object-cover"><div><h4 class="font-bold text-sm">${c.name}</h4></div></div>
                                        <div><button onclick="editCategory('${c.key}')" class="text-blue-500 p-2"><i class="fa-solid fa-pen text-xs"></i></button><button onclick="deleteCategory('${c.key}')" class="text-red-500 p-2"><i class="fa-solid fa-trash text-xs"></i></button></div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${currentAdminTab === 'faq' ? `
                        <div class="bg-white dark:bg-slate-900 border p-6 rounded-3xl max-w-3xl space-y-6">
                            <div class="flex justify-between border-b pb-4"><h3 class="font-bold">FAQs Manager</h3><button onclick="openAddFaqModal()" class="bg-amber-600 text-white text-xs font-bold px-4 py-2 rounded-xl hover:bg-amber-700">+ Add FAQ</button></div>
                            <div class="space-y-3">
                                ${faqsData.map((f, i) => `
                                    <div class="p-4 rounded-xl border bg-slate-50 dark:bg-slate-800">
                                        <div class="flex justify-between"><h4 class="font-bold text-sm text-amber-600">${f.q}</h4><button onclick="deleteFaq(${i})" class="text-red-500"><i class="fa-solid fa-trash"></i></button></div>
                                        <p class="text-xs mt-1 text-slate-500">${f.a}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${currentAdminTab === 'bulk' ? `
                        <div class="bg-white dark:bg-slate-900 border p-8 rounded-3xl max-w-xl space-y-4">
                            <h3 class="font-bold">Excel Bulk Upload</h3>
                            <button onclick="downloadExcelTemplate()" class="w-full bg-slate-200 dark:bg-slate-800 font-bold py-3 rounded-xl text-xs"><i class="fa-solid fa-download"></i> Download Template</button>
                            <input type="file" id="excel-file-input" accept=".xlsx, .xls" class="w-full text-xs file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-amber-50">
                            <button onclick="handleExcelBulkImport()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-xs uppercase hover:bg-emerald-700">Import Excel</button>
                        </div>
                    ` : ''}

                    ${currentAdminTab === 'settings' ? `
                        <div class="bg-white dark:bg-slate-900 border p-8 rounded-3xl max-w-xl space-y-4">
                            <h3 class="font-bold text-lg">Business & WhatsApp Settings</h3>
                            <form onsubmit="handleAdminBusinessUpdate(event)" class="space-y-3">
                                <input type="text" id="admin-bus-name" value="${businessInfo.name}" class="w-full border rounded-xl px-3 py-2 bg-slate-50 dark:bg-slate-800 text-xs">
                                <input type="text" id="admin-bus-license" value="${businessInfo.license}" class="w-full border rounded-xl px-3 py-2 bg-slate-50 dark:bg-slate-800 text-xs">
                                <textarea id="admin-bus-address" class="w-full border rounded-xl px-3 py-2 bg-slate-50 dark:bg-slate-800 text-xs">${businessInfo.address}</textarea>
                                <input type="text" id="admin-bus-contact" value="${siteSettings.whatsappNumber}" class="w-full border rounded-xl px-3 py-2 bg-slate-50 dark:bg-slate-800 text-xs font-bold text-emerald-500">
                                <button type="submit" class="w-full bg-amber-600 text-white font-bold py-3 rounded-xl text-xs uppercase hover:bg-amber-700">Save Settings</button>
                            </form>
                        </div>
                    ` : ''}
                </div>

                <!-- Add/Edit Product Modal -->
                <div id="admin-product-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
                    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeAdminModal()"></div>
                    <div class="relative bg-white dark:bg-slate-900 border w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-4">
                        <div class="flex justify-between border-b pb-3"><h3 id="admin-modal-title" class="font-bold">Add Product</h3><button onclick="closeAdminModal()"><i class="fa-solid fa-xmark"></i></button></div>
                        <form onsubmit="handleProductSaveForm(event)" class="space-y-3">
                            <input type="hidden" id="edit-prod-id">
                            <div><label class="block text-xs font-semibold mb-1">Product Name</label><input type="text" id="edit-prod-name" required class="w-full border rounded-xl px-3 py-2 text-xs bg-slate-50 dark:bg-slate-800"></div>
                            <div class="grid grid-cols-3 gap-2">
                                <div><label class="block text-xs font-semibold mb-1">Category</label><select id="edit-prod-cat" class="w-full border rounded-xl px-3 py-2 text-xs bg-slate-50 dark:bg-slate-800">${categoriesList.map(c => `<option value="${c.key}">${c.name}</option>`).join('')}</select></div>
                                <div><label class="block text-xs font-semibold mb-1">MRP (₹)</label><input type="number" id="edit-prod-price" required class="w-full border rounded-xl px-3 py-2 text-xs bg-slate-50 dark:bg-slate-800"></div>
                                <div><label class="block text-xs font-semibold mb-1">Discount (%)</label><input type="number" id="edit-prod-discount" placeholder="0" class="w-full border rounded-xl px-3 py-2 text-xs bg-slate-50 dark:bg-slate-800"></div>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="block text-xs font-semibold mb-1">Unit</label><input type="text" id="edit-prod-unit" required class="w-full border rounded-xl px-3 py-2 text-xs bg-slate-50 dark:bg-slate-800"></div>
                                <div><label class="block text-xs font-semibold mb-1">Image URL</label><input type="text" id="edit-prod-image" required class="w-full border rounded-xl px-3 py-2 text-xs bg-slate-50 dark:bg-slate-800"></div>
                            </div>
                            <div><label class="block text-xs font-semibold mb-1">Description</label><textarea id="edit-prod-desc" rows="2" class="w-full border rounded-xl px-3 py-2 text-xs bg-slate-50 dark:bg-slate-800"></textarea></div>
                            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl text-xs uppercase transition">Save Product</button>
                        </form>
                    </div>
                </div>
            `;
        }

        // Admin Action Handlers
        function toggleSelectAllProducts(isChecked) {
            document.querySelectorAll('.prod-check').forEach(c => c.checked = isChecked);
        }

        function bulkDeleteProducts() {
            const checks = document.querySelectorAll('.prod-check:checked');
            if(checks.length === 0) return;
            if(confirm(`Are you sure you want to delete ${checks.length} selected products?`)) {
                const ids = Array.from(checks).map(c => parseInt(c.value));
                productsData = productsData.filter(p => !ids.includes(p.id));
                syncChangesToCloud(); router.render();
            }
        }

        function toggleFeatured(id, isChecked) {
            if(!siteSettings.featuredProducts) siteSettings.featuredProducts = [];
            if(isChecked && !siteSettings.featuredProducts.includes(id)) siteSettings.featuredProducts.push(id);
            if(!isChecked) siteSettings.featuredProducts = siteSettings.featuredProducts.filter(x => x !== id);
        }

        function addOwnerProfile() {
            const n = document.getElementById('ow-add-name').value; 
            const r = document.getElementById('ow-add-role').value;
            const i = document.getElementById('ow-add-img').value; 
            const b = document.getElementById('ow-add-bio').value;
            if(!n || !r) { showToast("Name and Role are required","error"); return;}
            if(!ownerSettings.owners) ownerSettings.owners = [];
            ownerSettings.owners.push({ name:n, role:r, image:i||'https://placehold.co/120', bio:b });
            syncChangesToCloud(); router.render();
            showToast("Owner profile added");
        }

        function deleteProduct(id) {
            if(confirm("Delete this product?")) { productsData = productsData.filter(p=>p.id!==id); syncChangesToCloud(); router.render(); }
        }

        function setAdminCategoryTab(k) { currentAdminCategoryTab=k; router.render(); }
        
        function openAddProductModal() {
            document.getElementById('admin-modal-title').innerText="Add Product";
            document.getElementById('edit-prod-id').value="";
            document.getElementById('edit-prod-name').value="";
            document.getElementById('edit-prod-price').value="";
            document.getElementById('edit-prod-discount').value="";
            document.getElementById('edit-prod-image').value="";
            document.getElementById('edit-prod-desc').value="";
            document.getElementById('admin-product-modal').classList.remove('hidden');
        }

        function openEditProductModal(id) {
            const p=productsData.find(x=>x.id===id); if(!p)return;
            document.getElementById('admin-modal-title').innerText="Edit Product";
            document.getElementById('edit-prod-id').value=p.id;
            document.getElementById('edit-prod-name').value=p.name;
            document.getElementById('edit-prod-cat').value=p.category;
            document.getElementById('edit-prod-price').value=p.price;
            document.getElementById('edit-prod-discount').value=p.discount||0;
            document.getElementById('edit-prod-unit').value=p.unit;
            document.getElementById('edit-prod-image').value=p.image;
            document.getElementById('edit-prod-desc').value=p.desc;
            document.getElementById('admin-product-modal').classList.remove('hidden');
        }
        
        function closeAdminModal(){ document.getElementById('admin-product-modal').classList.add('hidden'); }

        function handleProductSaveForm(e) {
            e.preventDefault();
            const idVal = document.getElementById('edit-prod-id').value;
            const pd = {
                name: document.getElementById('edit-prod-name').value,
                category: document.getElementById('edit-prod-cat').value,
                price: parseFloat(document.getElementById('edit-prod-price').value),
                discount: parseFloat(document.getElementById('edit-prod-discount').value)||0,
                unit: document.getElementById('edit-prod-unit').value,
                image: document.getElementById('edit-prod-image').value,
                desc: document.getElementById('edit-prod-desc').value
            };
            if(idVal) {
                const i = productsData.findIndex(x=>x.id==idVal);
                if(i>-1) productsData[i] = {...productsData[i], ...pd};
            } else {
                productsData.unshift({...pd, id:Date.now(), specs: "Standard Festival Grade", safety: "Adult supervision required."});
            }
            closeAdminModal(); syncChangesToCloud(); router.render();
        }

        function handleHomepageCMSUpdate(e) {
            e.preventDefault();
            siteSettings.brandName = document.getElementById('cms-brand-name').value;
            siteSettings.storeTagline = document.getElementById('cms-brand-tag').value;
            siteSettings.logoUrl = document.getElementById('cms-logo-url').value;
            siteSettings.heroHeading = document.getElementById('cms-hero-heading').value;
            siteSettings.heroHighlight = document.getElementById('cms-hero-highlight').value;
            siteSettings.heroDesc = document.getElementById('cms-hero-desc').value;
            siteSettings.heroImage = document.getElementById('cms-hero-image').value;
            siteSettings.heroBgImage = document.getElementById('cms-hero-bg-image').value;
            siteSettings.bgOpacity = document.getElementById('cms-bg-op').value;
            
            document.getElementById('brand-title-header').innerText = siteSettings.brandName;
            document.getElementById('brand-tagline-header').innerText = siteSettings.storeTagline;
            const logo = document.getElementById('brand-logo-container');
            if(logo) logo.innerHTML = siteSettings.logoUrl ? `<img src="${siteSettings.logoUrl}" class="w-full h-full object-cover">` : `<i id="brand-logo-icon" class="fa-solid fa-wand-magic-sparkles text-lg"></i>`;
            
            syncChangesToCloud(); router.render();
            showToast("Homepage updated successfully!");
        }

        function handleAdminBusinessUpdate(e) {
            e.preventDefault();
            businessInfo.name = document.getElementById('admin-bus-name').value;
            businessInfo.license = document.getElementById('admin-bus-license').value;
            businessInfo.address = document.getElementById('admin-bus-address').value;
            siteSettings.whatsappNumber = document.getElementById('admin-bus-contact').value.replace(/[^0-9]/g, '');
            syncChangesToCloud(); router.render(); showToast("Business settings saved!");
        }

        function openAddCategoryModal() {
            const catName = prompt("Enter new category name:");
            if (catName) {
                const key = catName.toLowerCase().replace(/\s+/g, '-');
                const catImg = prompt("Enter category image URL:", "https://images.unsplash.com/photo-1513151233558-d860c5398176?w=400");
                if (!categoriesList.some(c => c.key === key)) {
                    categoriesList.push({ key, name: catName, image: catImg || "https://images.unsplash.com/photo-1513151233558-d860c5398176?w=400" });
                    syncChangesToCloud(); router.render();
                } else { showToast("Category already exists!", "error"); }
            }
        }
        function deleteCategory(key) { if(confirm("Delete this category?")) { categoriesList = categoriesList.filter(c => c.key !== key); syncChangesToCloud(); router.render(); } }
        function editCategory(key) {
            const cat = categoriesList.find(c => c.key === key); if(!cat) return;
            const newName = prompt("Edit category name:", cat.name);
            if(newName) { const newImg = prompt("Edit category image URL:", cat.image); cat.name = newName; if(newImg) cat.image = newImg; syncChangesToCloud(); router.render(); }
        }

        function openAddFaqModal() {
            const q = prompt("Enter FAQ Question:");
            if (q) { const a = prompt("Enter FAQ Answer:"); if (a) { faqsData.push({ q, a }); syncChangesToCloud(); router.render(); } }
        }
        function deleteFaq(idx) { if (confirm("Delete this FAQ item?")) { faqsData.splice(idx, 1); syncChangesToCloud(); router.render(); } }

        function downloadExcelTemplate() {
            const ws = XLSX.utils.json_to_sheet([{ name: "Sample Sparkler", category: "sparkles", price: 150, discount: 5, unit: "Box of 10", image: "https://.../img.jpg", desc: "Long-burning brilliant sparklers" }]);
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "ProductsTemplate"); XLSX.writeFile(wb, "SK_Crackers_Products.xlsx");
        }
        function handleExcelBulkImport() {
            const fileInput = document.getElementById('excel-file-input');
            if (!fileInput.files || fileInput.files.length === 0) return showToast("Select an Excel file first.", "error");
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                    const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    if (json.length > 0) {
                        const formatted = json.map((item, idx) => ({
                            id: Date.now() + idx, name: item.name || "Unnamed", category: item.category || "sparkles", price: parseFloat(item.price) || 100, discount: parseFloat(item.discount) || 0, unit: item.unit || "1 Box", image: item.image || "https://images.unsplash.com/photo-1513151233558-d860c5398176?w=400", desc: item.desc || "", specs: "Standard Grade", safety: "Supervise children."
                        }));
                        productsData = [...formatted, ...productsData]; syncChangesToCloud(); router.render(); showToast(`Imported ${formatted.length} products!`);
                    } else showToast("Excel file is empty.", "error");
                } catch(err) { showToast("Error parsing Excel file.", "error"); }
            };
            reader.readAsArrayBuffer(fileInput.files[0]);
        }

        // Supabase Initialization
        async function loadDataFromSupabase() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/store_data?id=eq.1`, { method: "GET", headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }});
                const rows = await res.json();
                if (rows && rows[0] && rows[0].content) {
                    const data = rows[0].content;
                    if(data.siteSettings) siteSettings = {...siteSettings, ...data.siteSettings};
                    if(data.ownerSettings) ownerSettings = data.ownerSettings;
                    if(data.timerSettings) timerSettings = data.timerSettings;
                    if(data.productsData) productsData = data.productsData;
                    if(data.categoriesList) categoriesList = data.categoriesList;
                    if(data.faqsData) faqsData = data.faqsData;
                    
                    document.getElementById('brand-title-header').innerText = siteSettings.brandName;
                    document.getElementById('brand-tagline-header').innerText = siteSettings.storeTagline || "Diwali Store";
                    const logo = document.getElementById('brand-logo-container');
                    if(logo) logo.innerHTML = siteSettings.logoUrl ? `<img src="${siteSettings.logoUrl}" class="w-full h-full object-cover">` : `<i id="brand-logo-icon" class="fa-solid fa-wand-magic-sparkles text-lg"></i>`;
                    
                    applyThemeColor();
                }
            } catch(e) { console.error("Supabase Load Error:", e); applyThemeColor(); }
        }

        async function syncChangesToCloud() {
            showToast("Saving changes to server...", "info");
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/store_data`, {
                    method: "POST", headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates" },
                    body: JSON.stringify({ id: 1, content: { siteSettings, ownerSettings, timerSettings, businessInfo, categoriesList, productsData, faqsData, safetyPointsData } })
                });
                showToast("Saved Successfully!");
            } catch(e) { showToast("Network Error", "error"); }
        }

    </script>
</body>
</html>
