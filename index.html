        function getCardActionHTML(productId) {
            const item = cart.find(i => i.id === productId);

            return `

                        <div class="card-action-${p.id} h-7 sm:h-8">${getCardActionHTML(p.id)}</div>
                    </div>
                </div>
            `;
        }

        function renderCatalogueView(initialCat = null) {
            if (initialCat !== null) selectedCategoryFilter = initialCat;
            const prods = filterProducts();
            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">

                        ${categoriesList.map(c => `<button onclick="setCategoryFilter('${c.key}')" class="cat-filter-btn whitespace-nowrap px-4 py-2 rounded-xl text-xs font-bold transition ${selectedCategoryFilter === c.key ? 'bg-theme-600 text-white shadow' : 'bg-white border border-slate-200 text-slate-600'}" data-cat="${c.key}">${c.name}</button>`).join('')}
                    </div>
                    <div id="product-grid-container" class="grid grid-cols-3 lg:grid-cols-5 gap-2 sm:gap-6">
                        ${prods.length > 0 ? prods.map(p => renderProductCard(p)).join('') : '<div class="col-span-full py-10 text-center"><p class="text-slate-400 text-xs">No products found.</p></div>'}
                    </div>
                </div>

        }

        function filterProducts() {
            return productsData.filter(p => {
                const mc = selectedCategoryFilter === 'all' || p.category === selectedCategoryFilter;
                const ms = p.name.toLowerCase().includes(searchQuery.toLowerCase());
                return mc && ms;
            });
        }

        function updateCatalogueDOM() {
            const container = document.getElementById('product-grid-container');
            if(!container) return;
            const prods = filterProducts();
            container.innerHTML = prods.length > 0 ? prods.map(p => renderProductCard(p)).join('') : '<div class="col-span-full py-10 text-center"><p class="text-slate-400 text-xs">No products found.</p></div>';
            
            document.querySelectorAll('.cat-filter-btn').forEach(btn => {
                if(btn.dataset.cat === selectedCategoryFilter) {
                    btn.className = "cat-filter-btn whitespace-nowrap px-4 py-2 rounded-xl text-xs font-bold transition bg-theme-600 text-white shadow";
                } else {
                    btn.className = "cat-filter-btn whitespace-nowrap px-4 py-2 rounded-xl text-xs font-bold transition bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300";
                }
            });
        }

        function setCategoryFilter(cat) {
            selectedCategoryFilter = cat;
            if (currentRoute === 'catalogue') { updateCatalogueDOM(); } 
            else { router.navigate('catalogue', cat); }
        }

        function handleSearchInput(val) {
            searchQuery = val;
            updateCatalogueDOM();
        }

        function renderProductDetailView(id) {
            const p = productsData.find(x => x.id == id) || productsData[0];
            const disc = p.discount || 0;
            const fp = disc ? Math.round(p.price - (p.price*disc/100)) : p.price;
            return `
                <div class="max-w-5xl mx-auto px-4 py-8 space-y-6">
                    <button onclick="router.navigate('catalogue')" class="text-theme-600 font-bold text-xs"><i class="fa-solid fa-arrow-left mr-1"></i> Back</button>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 bg-white dark:bg-slate-900 p-6 rounded-3xl shadow border border-slate-200">
                        <div class="relative bg-slate-100 rounded-2xl overflow-hidden aspect-square">
                            <img src="${p.image}" class="w-full h-full object-cover">
                        </div>
                        <div class="space-y-4 flex flex-col justify-center">
                            <span class="text-[10px] uppercase font-bold text-theme-600 border border-theme-200 px-2 py-1 rounded w-max">${p.category}</span>
                            <h1 class="text-2xl sm:text-3xl font-extrabold">${p.name}</h1>
                            <p class="text-sm text-slate-500">${p.desc}</p>
                            <div class="text-3xl font-black text-theme-600">
                                ${disc ? `<span class="text-lg text-slate-400 line-through mr-2">₹${p.price}</span>` : ''}₹${fp} <span class="text-xs font-medium text-slate-400">/ ${p.unit}</span>
                            </div>
                            <div class="pt-4 border-t border-slate-200 space-y-2">
                                <p class="text-xs text-slate-600"><strong>Specs:</strong> ${p.specs}</p>
                                <p class="text-xs text-red-600"><strong>Safety:</strong> ${p.safety}</p>
                            </div>
                            <button onclick="addToCart(${p.id}, 1); openCartDrawer();" class="w-full bg-theme-600 text-white font-bold py-3.5 rounded-xl mt-4">Add to Cart</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function addToCart(id, qty = 1) {
            const prod = productsData.find(p => p.id === id);
            if (!prod) return;
            const ex = cart.find(i => i.id === id);
            if (ex) { ex.qty += qty; } else { cart.push({ ...prod, qty }); }
            updateCartBadge();
            refreshCardAction(id);
            if(timerData.enabled && cart.length === 1 && !cartTimerInterval) startCartTimer();
        }

        function updateCartQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
            }
            updateCartBadge();
            renderCartDrawerContent();
            refreshCardAction(id);
            if(cart.length === 0) clearCartTimer();
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            updateCartBadge();
            renderCartDrawerContent();
            refreshCardAction(id);
            if(cart.length === 0) clearCartTimer();
        }

        function updateCartBadge() {
            const count = cart.reduce((s, i) => s + i.qty, 0);
            const b1 = document.getElementById('cart-badge');
            const b2 = document.getElementById('mobile-cart-badge');
            const c1 = document.getElementById('cart-count-header');
            if(b1) { b1.innerText = count; count > 0 ? b1.classList.remove('hidden') : b1.classList.add('hidden'); }
            if(b2) { b2.innerText = count; count > 0 ? b2.classList.remove('hidden') : b2.classList.add('hidden'); }
            if(c1) c1.innerText = count;
        }

        // Cart Timer Logic
        function startCartTimer() {
            if(!timerData.enabled) return;
            cartExpiryTime = Date.now() + (timerData.minutes * 60 * 1000);
            cartTimerInterval = setInterval(updateTimerDisplay, 1000);
        }
        function clearCartTimer() {
            clearInterval(cartTimerInterval);
            cartTimerInterval = null;
            const banner = document.getElementById('cart-timer-banner');
            if(banner) banner.classList.add('hidden');
        }
        function updateTimerDisplay() {
            const banner = document.getElementById('cart-timer-banner');
            const disp = document.getElementById('cart-timer-display');
            if(!banner || !disp) return;
            if(checkoutStep === 'summary' || cart.length === 0) { banner.classList.add('hidden'); return; }
            
            const remaining = cartExpiryTime - Date.now();
            if(remaining <= 0) {
                clearCartTimer();
                cart = [];
                updateCartBadge();
                closeCartDrawer();
                router.render();
                showToast("Cart reserved time expired. Cart reset.", "error");
                return;
            }
            banner.classList.remove('hidden');
            const m = Math.floor(remaining / 60000);
            const s = Math.floor((remaining % 60000) / 1000);
            disp.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function openCartDrawer() {
            checkoutStep = 'form';
            document.getElementById('cart-drawer').classList.remove('hidden');
            renderCartDrawerContent();
            updateTimerDisplay();
        }
        function closeCartDrawer() { document.getElementById('cart-drawer').classList.add('hidden'); }

        function renderCartDrawerContent() {
            const c = document.getElementById('cart-drawer-body');
            if (cart.length === 0) {
                c.innerHTML = `<div class="text-center py-20"><i class="fa-solid fa-cart-shopping text-4xl text-slate-300 mb-4"></i><h4 class="font-bold">Cart is empty</h4></div>`;
                return;
            }

            const totalMrp = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const totalDisc = cart.reduce((s, i) => s + ((i.discount || 0) ? (i.price * i.discount / 100) * i.qty : 0), 0);
            const subtotal = Math.round(totalMrp - totalDisc);

            if (checkoutStep === 'form') {
                c.innerHTML = `
                    <div class="space-y-3 max-h-[50vh] overflow-y-auto">
                        ${cart.map(i => {
                            const fp = i.discount ? Math.round(i.price - (i.price * i.discount / 100)) : i.price;

                            <div class="flex items-center justify-between p-3 bg-slate-50 border rounded-xl">
                                <div class="flex items-center space-x-3">
                                    <img src="${i.image}" class="w-10 h-10 rounded object-cover">
                                    <div><h5 class="font-bold text-[10px] sm:text-xs">${i.name}</h5><span class="text-[9px] text-slate-400">₹${fp} x${i.qty}</span></div>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <div class="flex items-center border bg-white rounded"><button onclick="updateCartQty(${i.id}, -1)" class="px-2 py-1 text-xs">-</button><span class="px-1 text-[10px]">${i.qty}</span><button onclick="updateCartQty(${i.id}, 1)" class="px-2 py-1 text-xs">+</button></div>
                                    <button onclick="removeFromCart(${i.id})" class="text-red-500"><i class="fa-solid fa-trash-can text-xs"></i></button>
                                </div>
                            </div>
                        `}).join('')}

        function handleCustomerFormSubmit(e) {
            e.preventDefault();
            customerDetails = { name: document.getElementById('f-name').value, mobile: document.getElementById('f-mobile').value, email: document.getElementById('f-email').value, address: document.getElementById('f-address').value, city: document.getElementById('f-city').value, pincode: document.getElementById('f-pincode').value };

        function sendWhatsAppTextEnquiry() {
            const tMrp = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const tDisc = cart.reduce((s, i) => s + ((i.discount || 0) ? (i.price * i.discount / 100) * i.qty : 0), 0);
            let itemsText = cart.map(i => {
                const fp = i.discount ? Math.round(i.price - (i.price * i.discount / 100)) : i.price;
                return `- ${i.name} (${i.unit}) x ${i.qty} = ₹${fp * i.qty}`;
            }).join('\n');
            const msg = encodeURIComponent(`*Order Enquiry - ${siteSettings.brandName}*\n\nName: ${customerDetails.name}\nMobile: ${customerDetails.mobile}\nAddress: ${customerDetails.address}, ${customerDetails.city}-${customerDetails.pincode}\n\n*Items:*\n${itemsText}\n\n*Total MRP:* ₹${Math.round(tMrp)}\n*Total Savings:* ₹${Math.round(tDisc)}\n*Final Pay:* ₹${Math.round(tMrp - tDisc)}`);
            window.open(`https://wa.me/91${siteSettings.whatsappNumber}?text=${msg}`, '_blank');
            cart = []; checkoutStep = 'form'; updateCartBadge(); closeCartDrawer(); clearCartTimer(); router.render();
        }

        // Cloud DB Sync (Supabase API)
        async function loadDataFromSupabase() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/store_data?id=eq.1`, { method: "GET", headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } });
                const rows = await res.json();
                if (rows && rows.length > 0 && rows[0].content) {
                    const data = rows[0].content;
                    if(data.siteSettings) siteSettings = data.siteSettings;
                    if(data.productsData) productsData = data.productsData;
                    if(data.categoriesList) categoriesList = data.categoriesList;
                    if(data.featuredProductIds) featuredProductIds = data.featuredProductIds;
                    if(data.ownerData) ownerData = data.ownerData;
                    if(data.timerData) timerData = data.timerData;
                    if(data.themeSettings) themeSettings = data.themeSettings;
                    
                    applyTheme(themeSettings.paletteId || 'amber');
                    
                    if(siteSettings.brandName) document.getElementById('brand-title-header').innerText = siteSettings.brandName;
                    if(siteSettings.subtitle) document.getElementById('brand-subtitle-header').innerText = siteSettings.subtitle;
                    if(siteSettings.logoUrl) document.getElementById('brand-logo-container').innerHTML = `<img src="${siteSettings.logoUrl}" class="w-full h-full object-cover">`;
                    
                    router.render();
                }
            } catch (err) { console.log("Load error", err); }
        }

        async function syncChangesToCloud() {
            showToast("Saving...", "info");
            try {
                const payload = { id: 1, content: { siteSettings, productsData, categoriesList, featuredProductIds, ownerData, timerData, themeSettings } };
                const res = await fetch(`${SUPABASE_URL}/rest/v1/store_data`, {
                    method: "POST", headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates" },
                    body: JSON.stringify(payload)
                });
                if (res.ok) showToast("Saved to Cloud!");
                else showToast("Failed to save", "error");
            } catch (err) { showToast("Network error", "error"); }
        }

        window.onload = async function() {
            applyTheme('amber'); // default init
            await loadDataFromSupabase();
            const hash = window.location.hash.replace('#', '');
            if(hash === 'admin') router.navigate('admin');
            else router.navigate(hash || 'home');
        };
    </script>
</body>
</html>
